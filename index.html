<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ប្រព័ន្ធរបាយការណ៍ - Direct Access Edition</title>
  <style>
    /* =========================================
       ពណ៌ Background លោតចម្រុះ
       ========================================= */
    body {
      font-family: 'Khmer OS Battambang', 'Segoe UI', sans-serif;
      background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab, #ff9a44);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      margin: 0;
      padding: 40px 20px;
    }
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes rainbowMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px;
      width: 100%;
      max-width: 520px;
      box-sizing: border-box;
      text-align: center;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    }
    
    .rainbow-text {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 20px;
      background-image: linear-gradient(90deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
      background-size: 400% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: rainbowMove 3s linear infinite;
      display: inline-block;
    }
    .form-group { margin-bottom: 15px; text-align: left; }
    label { display: block; margin-bottom: 8px; color: #666; font-weight: bold; }
    
    input, select {
      width: 100%;
      padding: 12px 15px;
      font-size: 16px;
      font-family: inherit;
      outline: none;
      box-sizing: border-box;
      transition: 0.3s;
      margin-bottom: 5px;
      border: 2px solid #ccc;
      border-radius: 10px;
      background-color: #fff;
    }
    input:focus, select:focus { 
      border-color: #764ba2; 
      box-shadow: 0 0 8px rgba(118, 75, 162, 0.2); 
    }

    .btn-action, .btn-copy {
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
      width: 100%;
      font-family: inherit;
      box-sizing: border-box;
      transition: 0.3s;
    }
    .btn-action {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(118, 75, 162, 0.2);
    }
    .btn-copy {
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      margin-top: 15px;
      box-shadow: 0 4px 15px rgba(17, 153, 142, 0.2);
    }
    .btn-action:hover, .btn-copy:hover { transform: translateY(-3px); }

    .simple-report-box {
      margin-top: 30px;
      text-align: left;
      padding: 20px;
      min-height: 150px;
      max-height: 400px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      border: 2px dashed #ccc;
      border-radius: 10px;
      background: #fdfdfd;
    }

    .report-header-date { color: #764ba2; font-weight: bold; margin-bottom: 15px; border-bottom: 2px solid #764ba2; white-space: pre-wrap; line-height: 1.5; padding-bottom: 10px; }
    .report-footer { margin-top: auto; padding-top: 15px; border-top: 2px solid #764ba2; text-align: center; color: #764ba2; font-weight: bold; }
    .report-line { padding: 10px 0; border-bottom: 1px dashed #ddd; display: flex; justify-content: space-between; align-items: flex-start; }
    .text-content { flex-grow: 1; padding: 5px; outline: none; line-height: 1.8; white-space: pre-wrap; font-size: 16px; }
    .text-content:focus { background-color: #fffde7; border: 1px dashed #f1c40f; border-radius: 5px;}
    .delete-btn { background: none; border: none; color: #ff4757; cursor: pointer; font-size: 14px; margin-top: 5px;}

    /* ====== ផ្នែកបញ្ជីសមាជិក ====== */
    .member-list-box {
      background: #fbfbff;
      border: 1px solid #764ba2;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 20px;
      text-align: left;
      max-height: 350px;
      overflow-y: auto;
      display: none; 
    }
    .member-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px dashed #ccc;
      flex-wrap: wrap;
      gap: 10px;
    }
    .member-row:last-child {
      border-bottom: none;
    }
    .member-info {
      flex: 1;
      font-size: 15px;
      color: #333;
    }
    .member-actions {
      display: flex;
      gap: 5px;
    }
    .btn-att {
      padding: 6px 12px;
      border: 1px solid #ccc;
      border-radius: 5px;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
      transition: 0.3s;
      background: #f0f0f0;
      color: #555;
    }
    .btn-att.present.active { background: #2ed573; color: white; border-color: #2ed573; box-shadow: 0 2px 8px rgba(46,213,115,0.4); }
    .btn-att.absent.active { background: #ff4757; color: white; border-color: #ff4757; box-shadow: 0 2px 8px rgba(255,71,87,0.4); }
    
    .absent-reason-input {
      width: 100%;
      margin-top: 5px;
      padding: 8px;
      font-size: 13px;
      display: none;
      border: 1px solid #ff4757;
      border-radius: 5px;
    }

    /* ====== ប៊ូតុង និងប្រអប់បន្ថែម/កែប្រែ ====== */
    .edit-del-btn {
      background: none; border: none; font-size: 13px; cursor: pointer; 
      padding: 3px 6px; margin-right: 5px; border-radius: 4px; font-family: inherit; font-weight: bold;
    }
    .edit-btn { color: #11998e; background: #e0f8f5; }
    .del-btn { color: #ff4757; background: #fff0f0; }

    .add-member-box {
      background: #fbfbff;
      border: 2px dashed #23a6d5;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 20px;
      text-align: left;
      display: none; 
    }
    .smallbtn{
      padding:8px 12px; border-radius:8px; border:none; cursor:pointer;
      font-family:inherit; font-weight:bold; color:#fff;
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      transition: 0.2s;
    }

    @media (max-width: 600px) {
      body { padding: 15px 10px; }
      .container { padding: 25px 20px; border-radius: 15px; }
      .rainbow-text { font-size: 24px; }
      input, select { padding: 12px; font-size: 15px; }
      .btn-action, .btn-copy { padding: 12px 20px; font-size: 16px; }
      .member-list-box { padding: 10px; }
      .member-info { font-size: 14px; }
      .btn-att { padding: 6px 10px; font-size: 13px; }
      .simple-report-box { padding: 15px; }
    }
  </style>
</head>

<body>
  <div class="container" id="appPage">
    <h1 class="rainbow-text" style="margin-top:0;">ស្រង់របាយការណ៍តាមក្រុម</h1>

    <div class="form-group">
      <label>ជ្រើសរើសពេល (Time)</label>
      <select id="timeSelect" onchange="updateHeader()">
        <option value="(ពេលព្រឹក)">ពេលព្រឹក</option>
        <option value="(ពេលរសៀល)" selected>ពេលរសៀល</option>
        <option value="(ពេលយប់)">ពេលយប់</option>
      </select>
    </div>

    <div class="form-group">
      <label>ជ្រើសរើស ឬ វាយបញ្ចូលក្រុម (Group)</label>
      <input list="groupList" id="groupSelect" placeholder="-- សូមរង់ចាំ ទាញយកទិន្នន័យ... --" autocomplete="off" oninput="loadMembers()">
      <datalist id="groupList"></datalist>
    </div>

    <div id="memberListBox" class="member-list-box">
    </div>

    <div id="addMemberSection" class="add-member-box">
      <b style="color:#23a6d5; font-size: 15px;">➕ បន្ថែមសមាជិកថ្មីចូលក្រុមនេះ</b>
      <div style="font-size: 13px; color: #888; margin-bottom: 10px;">(បន្ថែមបណ្តោះអាសន្នសម្រាប់ស្រង់របាយការណ៍នេះប៉ុណ្ណោះ)</div>
      <input type="text" id="newMemName" placeholder="ឈ្មោះសមាជិកថ្មី..." autocomplete="off">
      <input type="text" id="newMemUser" placeholder="Username (ឧ: @panha)" autocomplete="off">
      <button class="smallbtn" onclick="addLocalMember()" style="width: 100%; margin-top: 5px; padding: 12px; background: linear-gradient(135deg, #23a6d5 0%, #23d5ab 100%); font-size: 15px;">➕ បន្ថែមចូលបញ្ជីខាងលើ</button>
    </div>

    <datalist id="reasonOptions">
      <option value="ច្បាប់ឈឺ">
      <option value="ច្បាប់ទៅផ្ទះ">
      <option value="ច្បាប់ទៅក្រៅ">
      <option value="ច្បាប់ទៅប្រឡង">
    </datalist>

    <button id="actionBtn" class="btn-action" onclick="submitReport()" style="background: #999; box-shadow: none;">សូមវាយបញ្ចូលឈ្មោះក្រុមជាមុនសិន</button>

    <div id="reportContainer" class="simple-report-box">
      <div id="dateHeader" class="report-header-date"></div>
      <div id="reportFooter" class="report-footer"> សូមអរគុណ🙏🙏🙏</div>
    </div>

    <button class="btn-copy" onclick="copyReport()">ចម្លងរបាយការណ៍ (Copy Report)</button>
  </div>

  <script>
    function clearReportView() {
      const container = document.getElementById("reportContainer");
      const footer = document.getElementById("reportFooter");
      if (!container || !footer) return;
      const lines = container.querySelectorAll(".report-line");
      lines.forEach(line => line.remove());
    }

    function escapeAttr(str) {
      if(!str) return "";
      return String(str).replaceAll("\\", "\\\\").replaceAll("'", "\\'").replaceAll('"', "&quot;");
    }

    /* ========= GOOGLE SHEET INTEGRATION ========= */
    // ⚠️ កុំភ្លេចដាក់ Link CSV ពី Google Sheet របស់អ្នកពិតប្រាកដនៅទីនេះ
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1okm-8WnOJ5I4AsBIRTp1stxAPTTBiMn1H6_Zhw0f9Lk/export?format=csv"; 
    let allSheetData = [];

    async function fetchSheetData() {
      try {
        const response = await fetch(SHEET_CSV_URL);
        const csvText = await response.text();
        parseCSV(csvText);
      } catch (error) {
        console.error("Error fetching sheet:", error);
        document.getElementById('groupSelect').placeholder = "❌ បរាជ័យក្នុងការទាញទិន្នន័យ (សូមពិនិត្យ Link)";
      }
    }

    function splitCSVRow(str) {
      const result = [];
      let current = '';
      let inQuotes = false;
      for (let i = 0; i < str.length; i++) {
        if (str[i] === '"') inQuotes = !inQuotes;
        else if (str[i] === ',' && !inQuotes) { result.push(current); current = ''; }
        else current += str[i];
      }
      result.push(current);
      return result.map(s => s.replace(/^"|"$/g, '').trim());
    }

    function parseCSV(csvText) {
      const rows = csvText.split(/\r?\n/);
      allSheetData = [];
      let groups = new Set();

      let groupIdx = 0, nameIdx = 1, userIdx = 2;
      let headerFound = false;
      let currentSectionGroup = ""; 

      for (let i = 0; i < rows.length; i++) {
        if (!rows[i].trim()) continue;
        const cols = splitCSVRow(rows[i]);

        if (!headerFound) {
          const rowStr = rows[i].toLowerCase();
          if (rowStr.includes('ក្រុម') || rowStr.includes('ឈ្មោះ') || rowStr.includes('user')) {
            cols.forEach((col, idx) => {
              const colStr = col.toLowerCase();
              if (colStr.includes('ក្រុម') || colStr.includes('group')) groupIdx = idx;
              else if (colStr.includes('user')) userIdx = idx;
              else if (colStr.includes('ឈ្មោះ') || colStr.includes('name')) nameIdx = idx;
            });
            headerFound = true; continue;
          }
        }

        let possibleHeader = cols.find(c => c.trim().startsWith("ក្រុម") && c.trim().length <= 25);
        let hasAtSymbol = rows[i].includes("@"); 
        
        if (possibleHeader && !hasAtSymbol) {
          currentSectionGroup = possibleHeader.trim(); continue; 
        }

        if (headerFound || i > 0) {
          let rowGroup = cols[groupIdx] ? cols[groupIdx].trim() : "";
          let name = cols[nameIdx] ? cols[nameIdx].trim() : "";
          let username = cols[userIdx] ? cols[userIdx].trim() : "";
          let finalGroup = currentSectionGroup || rowGroup;

          if (finalGroup && !finalGroup.includes("ក្រុម") && !finalGroup.toLowerCase().includes("group")) {
            finalGroup = "ក្រុម " + finalGroup; 
          }

          if (finalGroup && name && !name.includes("ឈ្មោះ") && name.toLowerCase() !== "name") {
            allSheetData.push({ group: finalGroup, name, username });
            groups.add(finalGroup);
          }
        }
      }

      const groupInput = document.getElementById('groupSelect');
      const groupList = document.getElementById('groupList');
      groupList.innerHTML = ``;
      groupInput.placeholder = "-- វាយឈ្មោះ ឬជ្រើសរើសក្រុមទីនេះ --";
      
      Array.from(groups).sort(new Intl.Collator('km', {numeric: true}).compare).forEach(g => {
        groupList.innerHTML += `<option value="${g}">`;
      });
    }

    function loadMembers() {
      const groupInput = document.getElementById('groupSelect');
      let selectedGroup = groupInput.value.trim();
      const memberBox = document.getElementById('memberListBox');
      const actionBtn = document.getElementById('actionBtn');
      const addMemberSec = document.getElementById('addMemberSection');

      if (!selectedGroup) {
        memberBox.style.display = 'none';
        addMemberSec.style.display = 'none';
        actionBtn.innerText = "សូមវាយបញ្ចូលឈ្មោះក្រុមជាមុនសិន";
        actionBtn.style.background = "#999";
        actionBtn.style.boxShadow = "none";
        return;
      }

      let members = allSheetData.filter(m => m.group.toLowerCase() === selectedGroup.toLowerCase());
      
      if (members.length === 0) {
        let prefixed = "ក្រុម " + selectedGroup;
        members = allSheetData.filter(m => m.group.toLowerCase() === prefixed.toLowerCase());
        if(members.length > 0) {
          selectedGroup = members[0].group; 
        }
      }

      if (members.length === 0) {
        memberBox.innerHTML = `<div style="text-align:center; padding:10px; color:#888;">មិនទាន់មានសមាជិកក្នុង <b>${selectedGroup}</b> ទេ! សូមបន្ថែមនៅខាងក្រោម។</div>`;
        memberBox.style.display = 'block';
        addMemberSec.style.display = 'block';
        
        actionBtn.innerText = "ដាក់បញ្ចូលរបាយការណ៍ (Submit)";
        actionBtn.style.background = "linear-gradient(135deg, #667eea 0%, #764ba2 100%)";
        actionBtn.style.boxShadow = "0 4px 15px rgba(118, 75, 162, 0.2)";
        return;
      }
      
      let html = `<b style="color:#764ba2; font-size: 16px;">បញ្ជីសមាជិក៖ ${selectedGroup} (សរុប ${members.length} នាក់)</b><div style="margin-top:15px;">`;
      
      members.forEach((m) => {
        let displayUser = m.username ? (m.username.startsWith('@') ? m.username : '@' + m.username) : '';
        let combinedName = `${m.name} ${displayUser}`.trim(); 
        
        html += `
          <div class="member-row" data-name="${combinedName}">
            <div class="member-info">
              <b>${m.name}</b> <span style="color:#23a6d5; font-size:14px; margin-left:5px;">${displayUser}</span>
              <div style="margin-top: 5px;">
                <button class="edit-del-btn edit-btn" onclick="editLocalMember('${escapeAttr(m.name)}', '${escapeAttr(m.username)}', '${escapeAttr(selectedGroup)}')">✏️ កែប្រែ</button>
                <button class="edit-del-btn del-btn" onclick="deleteLocalMember('${escapeAttr(m.name)}', '${escapeAttr(m.username)}', '${escapeAttr(selectedGroup)}')">🗑️ លុប</button>
              </div>
            </div>
            <div class="member-actions">
              <button class="btn-att present active" onclick="setAttendance(this, 'present')">វត្តមាន</button>
              <button class="btn-att absent" onclick="setAttendance(this, 'absent')">អវត្តមាន</button>
            </div>
            <input type="text" class="absent-reason-input" placeholder="មូលហេតុអវត្តមាន..." list="reasonOptions">
          </div>
        `;
      });
      html += `</div>`;
      
      memberBox.innerHTML = html;
      memberBox.style.display = 'block';
      addMemberSec.style.display = 'block';

      actionBtn.innerText = "ដាក់បញ្ចូលរបាយការណ៍ (Submit)";
      actionBtn.style.background = "linear-gradient(135deg, #667eea 0%, #764ba2 100%)";
      actionBtn.style.boxShadow = "0 4px 15px rgba(118, 75, 162, 0.2)";
    }

    function setAttendance(btn, status) {
      const row = btn.closest('.member-row');
      const btnPresent = row.querySelector('.btn-att.present');
      const btnAbsent = row.querySelector('.btn-att.absent');
      const reasonInput = row.querySelector('.absent-reason-input');

      if (status === 'present') {
        btnPresent.classList.add('active');
        btnAbsent.classList.remove('active');
        reasonInput.style.display = 'none';
        reasonInput.value = ''; 
      } else {
        btnPresent.classList.remove('active');
        btnAbsent.classList.add('active');
        reasonInput.style.display = 'block';
        reasonInput.focus();
      }
    }

    // =====================================
    // មុខងារ បន្ថែម កែប្រែ លុប សមាជិក (Local)
    // =====================================
    function addLocalMember() {
      const groupInput = document.getElementById('groupSelect').value.trim();
      if (!groupInput) { alert("សូមជ្រើសរើសក្រុមជាមុនសិន!"); return; }

      let selectedGroup = groupInput;
      let exactGroup = allSheetData.find(m => m.group.toLowerCase() === groupInput.toLowerCase() || m.group.toLowerCase() === ("ក្រុម " + groupInput).toLowerCase());
      if(exactGroup) selectedGroup = exactGroup.group;

      const name = document.getElementById('newMemName').value.trim();
      const user = document.getElementById('newMemUser').value.trim();

      if (!name) { alert("សូមបញ្ចូលឈ្មោះសមាជិក!"); return; }

      allSheetData.push({ group: selectedGroup, name: name, username: user });
      document.getElementById('newMemName').value = "";
      document.getElementById('newMemUser').value = "";
      loadMembers(); 
    }

    function editLocalMember(name, user, group) {
      const newName = prompt("កែប្រែឈ្មោះ:", name);
      if (newName === null) return; 
      
      const newUser = prompt("កែប្រែ Username:", user);
      if (newUser === null) return; 

      if (newName.trim() === "") { alert("ឈ្មោះមិនអាចទទេបានទេ!"); return; }

      const index = allSheetData.findIndex(m => m.group === group && m.name === name && (m.username === user || (!m.username && !user)));
      if (index > -1) {
        allSheetData[index].name = newName.trim();
        allSheetData[index].username = newUser.trim();
        loadMembers();
      }
    }

    function deleteLocalMember(name, user, group) {
      if (!confirm(`តើអ្នកពិតជាចង់លុប "${name}" ចេញពីបញ្ជីនេះមែនទេ?`)) return;
      const index = allSheetData.findIndex(m => m.group === group && m.name === name && (m.username === user || (!m.username && !user)));
      if (index > -1) {
        allSheetData.splice(index, 1);
        loadMembers();
      }
    }

    /* ========= APP INIT ========= */
    window.onload = function() {
      initApp();
    };

    function initApp() {
      updateHeader();
      clearReportView();
      loadFromLocalStorage();
      fetchSheetData(); 
    }

    /* ========= REPORT FUNCTIONS ========= */
    function updateHeader() {
      const today = new Date();
      const timeVal = document.getElementById('timeSelect').value;
      const headerText = `ជម្រាបបងនេះរាយការណ៍នៅថ្ងៃទី ${today.getDate()} ខែ ${today.getMonth() + 1} ឆ្នាំ ${today.getFullYear()}\n${timeVal}`;
      document.getElementById('dateHeader').innerText = headerText;
    }

    function submitReport() {
      let groupValue = document.getElementById('groupSelect').value.trim();
      
      let exactGroup = allSheetData.find(m => m.group.toLowerCase() === groupValue.toLowerCase() || m.group.toLowerCase() === ("ក្រុម " + groupValue).toLowerCase());
      
      if (!exactGroup) {
        exactGroup = { group: groupValue.startsWith("ក្រុម") ? groupValue : "ក្រុម " + groupValue };
      }
      const selectedGroup = exactGroup.group;

      const rows = document.querySelectorAll('#memberListBox .member-row');
      const totalMembers = rows.length;
      
      if(totalMembers === 0) {
        alert("មិនមានសមាជិកក្នុងក្រុមនេះទេ សូមបន្ថែមសមាជិកជាមុនសិន!");
        return;
      }

      let absentees = [];
      let presents = [];

      rows.forEach(row => {
        const isAbsent = row.querySelector('.btn-att.absent').classList.contains('active');
        const fullName = row.getAttribute('data-name'); 
        
        if (isAbsent) {
          let reason = row.querySelector('.absent-reason-input').value.trim();
          if(!reason) reason = "គ្មានមូលហេតុ";
          absentees.push(`- ${fullName} ( ${reason} )`);
        } else {
          presents.push(`- ${fullName}`);
        }
      });

      let shortGroupName = selectedGroup;
      if (!shortGroupName.startsWith("ក្រុម")) { shortGroupName = "ក្រុម " + shortGroupName; }

      let line1 = `${shortGroupName} សមាជិក ${totalMembers}នាក់`;
      let finalHTML = "";

      let presentHTML = "";
      if (presents.length > 0) {
        presentHTML = `<br>👉 <b>វត្តមាន (${presents.length}នាក់)៖</b><br>` + presents.join('<br>');
      }

      let absenteeHTML = "";
      if (absentees.length > 0) {
        absenteeHTML = `<br>👉 <b>អវត្តមាន (${absentees.length}នាក់)៖</b><br>` + absentees.join('<br>');
      }

      if (absentees.length === 0) {
        finalHTML = `${line1} (សមាជិកនៅកន្លែងគ្រប់)${presentHTML}`;
      } else {
        finalHTML = `${line1}${presentHTML}${absenteeHTML}`;
      }

      const container = document.getElementById('reportContainer');
      const footer = document.getElementById('reportFooter');
      
      const newLine = document.createElement('div');
      newLine.className = 'report-line';
      newLine.innerHTML = `
        <div class="text-content" contenteditable="true" oninput="saveToLocalStorage()">${finalHTML}</div>
        <button class="delete-btn" onclick="removeLine(this)">❌</button>
      `;

      container.insertBefore(newLine, footer);
      saveToLocalStorage();

      document.getElementById('groupSelect').value = "";
      loadMembers(); 
    }

    function saveToLocalStorage() {
      const lines = document.querySelectorAll('.report-line .text-content');
      let dataToSave = [];
      lines.forEach(line => dataToSave.push(line.innerHTML));
      localStorage.setItem('myReportData_default', JSON.stringify(dataToSave));
    }

    function loadFromLocalStorage() {
      clearReportView();
      const savedData = localStorage.getItem('myReportData_default');
      
      if (savedData) {
        const reports = JSON.parse(savedData);
        const container = document.getElementById('reportContainer');
        const footer = document.getElementById('reportFooter');

        reports.forEach(htmlContent => {
          const newLine = document.createElement('div');
          newLine.className = 'report-line';
          newLine.innerHTML = `
            <div class="text-content" contenteditable="true" oninput="saveToLocalStorage()">${htmlContent}</div>
            <button class="delete-btn" onclick="removeLine(this)">❌</button>
          `;
          container.insertBefore(newLine, footer);
        });
      }
    }

    function removeLine(btn) {
      btn.parentElement.remove();
      saveToLocalStorage();
    }

    function copyReport() {
      const dateHeader = document.getElementById('dateHeader').innerText;
      const reportFooter = document.getElementById('reportFooter').innerText;
      const lines = document.querySelectorAll('.text-content');

      let fullText = dateHeader + "\n\n";
      lines.forEach(line => { fullText += line.innerText + "\n\n"; });
      fullText += reportFooter;

      if (lines.length === 0) { alert("មិនមានទិន្នន័យសម្រាប់ចម្លងទេ!"); return; }

      navigator.clipboard.writeText(fullText)
        .then(() => { alert("✅ បានចម្លងរបាយការណ៍រួចរាល់!"); })
        .catch(err => { console.error('Failed to copy: ', err); });
    }
  </script>
</body>
</html>
